name: Build macOS (VST3 + AU)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach zips to a GitHub Release on v* tags

env:
  BUILD_TYPE: Release
  PRODUCT: Cymbalis
  AU_TYPE: aumu
  AU_SUBTYPE: Cymb
  AU_MANUFACTURER: Dham

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JUCE 7.0.12 predates the macOS 15 SDK; build against Xcode 15.x (macOS 14 SDK).
      - name: Select Xcode 15
        run: |
          XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Cache JUCE source
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ env.BUILD_TYPE }}

      # Cymbalis with the Tuning window (CYMBALIS_WITH_TUNING, ON by default, docs/TUNING.md).
      - name: Configure (universal arm64 + x86_64)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DFETCHCONTENT_BASE_DIR="${GITHUB_WORKSPACE}/.deps"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --target ${PRODUCT}_VST3 ${PRODUCT}_AU CymbalisUiTest cymbalis_bench cymbalis_bench_profile cymbalis_trims --parallel

      # CPU cost of the real-time engine on this runner (Apple Silicon), every slot playing.
      # Printed to the log and the job summary only; nothing is uploaded.
      - name: CPU benchmark (fast engine, all slots playing)
        run: |
          CPU=$(sysctl -n machdep.cpu.brand_string)
          BENCH=build/tools/cymbalis_bench/cymbalis_bench
          {
            echo "### Fast engine CPU on ${CPU}"
            for PRESET in nova_ride smoke_flat_ride hammered_thin_ride swish raven; do
              BAKE="resources/presets/${PRESET}.bake.json"
              echo
              echo "#### ${PRESET}"
              echo
              "$BENCH" --bake "$BAKE" --seconds 60 --block 256
              echo
              "$BENCH" --bake "$BAKE" --seconds 60 --block 64 --sample-rate 48000
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "${PIPESTATUS[0]}" -eq 0

      # The engine's block times in dense playing (a strike every 24 ms, every preset, 44.1 and
      # 96 kHz, 128- and 64-sample blocks, real-time thread, each case three times in turn),
      # then where strike() and the slowest blocks spend their time (profile build, blocks back
      # to back). Printed to the log and the job summary only; nothing is uploaded.
      - name: Engine block times in dense playing
        timeout-minutes: 15
        run: |
          BAKES=()
          for PRESET in nova_ride smoke_flat_ride hammered_thin_ride swish raven; do
            BAKES+=(--bake "resources/presets/${PRESET}.bake.json")
          done
          {
            echo "### Engine block times in dense playing"
            echo
            build/tools/cymbalis_bench/cymbalis_bench --dense "${BAKES[@]}" --ftz-off
            echo
            echo "### Engine parts in dense playing (profile build)"
            echo
            build/tools/cymbalis_bench/cymbalis_bench_profile --dense "${BAKES[@]}" --runs 1 --sample-rate 44100 --block 128 --free
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Locate bundles
        run: |
          ART="build/${PRODUCT}_artefacts/${BUILD_TYPE}"
          echo "VST3=$ART/VST3/${PRODUCT}.vst3" >> "$GITHUB_ENV"
          echo "AU=$ART/AU/${PRODUCT}.component" >> "$GITHUB_ENV"
          ls -la "$ART/VST3" "$ART/AU"

      - name: Check both architectures are present
        run: |
          check() {
            local BIN="$1/Contents/MacOS/$2"
            ARCHS=$(lipo -archs "$BIN")
            echo "$BIN -> $ARCHS, $(stat -f%z "$BIN") bytes"
            [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "::error::$BIN is not universal"; exit 1; }
          }
          check "$VST3" "$PRODUCT"; check "$AU" "$PRODUCT"

      - name: Check x86_64 slice has no AVX instructions
        run: |
          BIN="$VST3/Contents/MacOS/${PRODUCT}"
          COUNT=$(otool -arch x86_64 -tv "$BIN" | grep -cE '%[yz]mm' || true)
          echo "AVX/AVX-512 register uses in the x86_64 slice of $BIN: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "::error::AVX found in x86_64 slice (Rosetta 2 crash risk)"; exit 1; }

      - name: Ad-hoc code sign
        run: |
          for B in "$VST3" "$AU"; do
            codesign --force --deep --sign - "$B"
            codesign --verify --deep --strict --verbose=2 "$B"
          done

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 5 \
            --validate-in-process \
            --skip-gui-tests \
            --timeout-ms 300000 \
            --validate "$VST3"

      - name: Validate AU (auval, native + Rosetta)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i "$AU_MANUFACTURER" || true
          auval -strict -v $AU_TYPE $AU_SUBTYPE $AU_MANUFACTURER
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "--- x86_64 slice under Rosetta ---"
            arch -x86_64 auval -strict -v $AU_TYPE $AU_SUBTYPE $AU_MANUFACTURER
          else
            echo "Rosetta not installed on this runner; skipping x86_64 auval"
          fi

      # Real mouse events through the AU and VST3 wrappers: EDGE's default note (64), then change
      # the MIDI channel, the slot notes (drag, menu, RESET DEFAULT, note list), a stick, the
      # preset and a stick of that preset, then SWISH and RAVEN, in the editor, and check the
      # plugin's saved state; the scroll wheel over the knobs and boxes must change nothing. Then click
      # TUNING: the Tuning window must be visible, in front of the editor and attached to it;
      # the wheel over its sliders and numeric boxes must change nothing; a second click hides
      # it (tools/cymbalis_uitest).
      - name: Editor mouse test (AU and VST3)
        timeout-minutes: 5
        run: |
          UITEST="build/CymbalisUiTest_artefacts/${BUILD_TYPE}/CymbalisUiTest.app/Contents/MacOS/CymbalisUiTest"
          STEPS="edge channel drag reset none edgereset list stick preset shoulder swish raven wheel tuning wheeltuning tuningclose"
          echo "--- VST3 ---"
          "$UITEST" "$PWD/$VST3" $STEPS
          echo "--- AU ---"
          "$UITEST" AU $STEPS

      # The hit display (docs/UI_SPEC.md sections 10 and 11) with 16 hits moving the wireframe
      # cymbal at 1536 x 1024: processBlock at 44.1 kHz (256 and 128 samples, normal and
      # real-time audio thread) with the editor closed, open and idle, and open with the hits,
      # each three times; the CPU used besides; the editor's paint calls and the cymbal's
      # OpenGL frames; and once, that nothing is drawn after every hit is older than 6 s.
      # Printed to the log and the job summary only.
      - name: Hit display timing
        timeout-minutes: 10
        run: |
          UITEST="build/CymbalisUiTest_artefacts/${BUILD_TYPE}/CymbalisUiTest.app/Contents/MacOS/CymbalisUiTest"
          "$UITEST" hits | tee hits.txt
          test "${PIPESTATUS[0]}" -eq 0
          { echo "### Hit display timing"; echo '```'; cat hits.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          SHA=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="$SHA"; fi
          mkdir -p dist
          ditto -c -k --keepParent "$VST3"  "dist/${PRODUCT}-VST3-macOS-${TAG}.zip"
          ditto -c -k --keepParent "$AU"    "dist/${PRODUCT}-AU-macOS-${TAG}.zip"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-macOS-${{ env.TAG }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
