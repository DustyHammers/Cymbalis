name: Build macOS (VST3 + AU)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      # The long tests (dhpool self-test, dense block times, kit benchmark, mouse test, hit display
      # timing) run only when asked for here, or on a v* tag (docs/BUILDS.md, "What CI runs").
      full_tests:
        description: 'full tests (dhpool self-test, dense block times, kit benchmark, mouse test, hit display timing)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach zips to a GitHub Release on v* tags

env:
  BUILD_TYPE: Release
  PRODUCT: Cymbalis
  AU_TYPE: aumu
  AU_SUBTYPE: Cymb
  AU_MANUFACTURER: Dham

jobs:
  build:
    # macos-14 is retired on 2026-11-02 (brownouts before that); macos-15 replaces it.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # The Xcode the plugin is built with, pinned so that a new image default (26.x) doesn't
      # change the build: Xcode 16.4, macOS 15.5 SDK.
      XCODE_VERSION: '16.4'
      # JUCE 7.0.12 builds its helper juceaide during configure, in a CMake build of its own that
      # doesn't get CMAKE_OSX_DEPLOYMENT_TARGET from CMakeLists.txt. That build (CMake, and clang
      # without -mmacosx-version-min) takes the deployment target from this variable instead;
      # without it juceaide targets the SDK's macOS 15.5, where JUCE's CGWindowListCreateImage is
      # obsoleted (an error) rather than deprecated. The plugin's own targets keep CMakeLists.txt's
      # 11.0, the same value.
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::$XCODE is not on this runner image; it has $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "SDK $(xcrun --show-sdk-version)"

      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      # .deps also holds JUCE's build directory, juceaide's build included, so the key names the
      # Xcode: a cache made with another one (macos-14's Xcode 15.4) isn't reused.
      - name: Cache JUCE source
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ env.BUILD_TYPE }}

      # Cymbalis with the TUNING page (CYMBALIS_WITH_TUNING, ON by default, docs/TUNING.md).
      # The toolchain goes into a notice, and on failure the error lines into annotations
      # (.github/scripts/annotate_errors.sh), which can be read without the job's log.
      - name: Configure (universal arm64 + x86_64)
        run: |
          echo "::notice::$(cmake --version | head -1); $(xcodebuild -version | tr '\n' ' '); SDK $(xcrun --show-sdk-version); MACOSX_DEPLOYMENT_TARGET ${MACOSX_DEPLOYMENT_TARGET}"
          set -o pipefail
          if ! cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DFETCHCONTENT_BASE_DIR="${GITHUB_WORKSPACE}/.deps" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee configure.log; then
            .github/scripts/annotate_errors.sh configure.log Configure
            exit 1
          fi

      # The test tools are built every time (a broken one is a build error) even when their steps
      # don't run: they compile alongside the plugin and finish before its link.
      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --target ${PRODUCT}_VST3 ${PRODUCT}_AU CymbalisUiTest cymbalis_bench cymbalis_bench_profile cymbalis_trims dhpool_selftest --parallel 2>&1 | tee build.log; then
            .github/scripts/annotate_errors.sh build.log Build
            exit 1
          fi

      # dhpool, the job pool shared with Tympanis (shared/dhpool/README-pool.md): its self-test,
      # dummy jobs at 1 to 4 threads. Every job must run exactly once per run, give the same bits
      # at every thread count (flush to zero on and off), and work in several runs per block; a
      # workgroup hook change must reach every worker; prepare / release must leave no thread
      # behind. Log only; a failed check fails the job.
      # On request only (full_tests) or on a v* tag, as the other long tests below.
      - name: Job pool self-test (dhpool)
        if: (github.event_name == 'workflow_dispatch' && inputs.full_tests) || startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 5
        run: build/shared/dhpool/dhpool_selftest

      # CPU cost of the real-time engine on this runner (Apple Silicon), every slot playing (on
      # HI-HAT with the pedal moving: cymbalis_bench). Printed to the log and the job summary
      # only; nothing is uploaded.
      - name: CPU benchmark (fast engine, all slots playing)
        run: |
          CPU=$(sysctl -n machdep.cpu.brand_string)
          BENCH=build/tools/cymbalis_bench/cymbalis_bench
          {
            echo "### Fast engine CPU on ${CPU}"
            for PRESET in nova_ride stine_flat_ride hammered_thin_ride swish raven paperthin konstan azcrash hihat; do
              BAKE="resources/presets/${PRESET}.bake.json"
              echo
              echo "#### ${PRESET}"
              echo
              "$BENCH" --bake "$BAKE" --seconds 60 --block 256
              echo
              "$BENCH" --bake "$BAKE" --seconds 60 --block 64 --sample-rate 48000
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "${PIPESTATUS[0]}" -eq 0

      # The engine's block times in dense playing (a strike every 24 ms, every preset, HI-HAT with
      # its pedal moving, 44.1 and 96 kHz, 128- and 64-sample blocks, real-time thread, each case three times in turn),
      # then where strike() and the slowest blocks spend their time (profile build, blocks back
      # to back). Printed to the log and the job summary only; nothing is uploaded.
      # On request only (full_tests) or on a v* tag.
      - name: Engine block times in dense playing
        if: (github.event_name == 'workflow_dispatch' && inputs.full_tests) || startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 15
        run: |
          BAKES=()
          for PRESET in nova_ride stine_flat_ride hammered_thin_ride swish raven paperthin konstan azcrash hihat; do
            BAKES+=(--bake "resources/presets/${PRESET}.bake.json")
          done
          {
            echo "### Engine block times in dense playing"
            echo
            build/tools/cymbalis_bench/cymbalis_bench --dense "${BAKES[@]}" --ftz-off
            echo
            echo "### Engine parts in dense playing (profile build)"
            echo
            build/tools/cymbalis_bench/cymbalis_bench_profile --dense "${BAKES[@]}" --runs 1 --sample-rate 44100 --block 128 --free
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "${PIPESTATUS[0]}" -eq 0

      # Several cymbals rendered together through the engine pool (plugin/dsp/EnginePool.h, on
      # dhpool since step 2; the plugin doesn't use it yet; docs/PORT_MAP.md, "Multi-cymbal
      # rendering"), with the caller's wait for engines still on workers in each table: the kit
      # (NOVA RIDE, HI-HAT with its pedal moving, CRASH 16", KONSTAN, STINE, RAVEN, SWISH, EXTRA
      # PAPER THIN, HAMMERED, SMOKE FLAT RIDE) in a groove and a stress pattern, 1, 2, 4, 6 and 10
      # cymbals, 1 to 3 threads (the runner's performance cores; 1 cymbal at 1 and 3), 44.1 and
      # 96 kHz, 128- and 64-sample blocks, the calling thread real-time, each case three times in
      # turn, and 10 cymbals with only the ride playing (the quiet cymbals); then the 10-cymbal
      # cases with the workers spinning through each block (3 ms) instead of sleeping, at 44.1 kHz /
      # 128 and 96 kHz / 64. It fails only if a threaded mix differs from one thread's by a bit, a
      # one-thread mix differs from #74's pool's (a copy kept in the bench), or a sample is not
      # finite; never on timing. 2 s timed per run, not the 60 s the bench defaults to (at 60 s
      # these cases would take about 6 hours): about 15 minutes in all. Printed to the log and the
      # job summary only; nothing is uploaded.
      # On request only (full_tests) or on a v* tag.
      - name: Kit benchmark (engine pool)
        if: (github.event_name == 'workflow_dispatch' && inputs.full_tests) || startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 20
        run: |
          BENCH=build/tools/cymbalis_bench/cymbalis_bench
          (
            echo "### Kit benchmark (engine pool)"
            echo
            A=0; B=0; C=0
            "$BENCH" --kit --seconds 2 || A=$?
            echo
            echo "### Kit benchmark: workers spinning through each block (3 ms) instead of sleeping"
            echo
            "$BENCH" --kit --seconds 2 --cymbals 10 --threads 3 --no-quiet --spin-us 3000 --sample-rate 44100 --block 128 || B=$?
            echo
            "$BENCH" --kit --seconds 2 --cymbals 10 --threads 3 --no-quiet --spin-us 3000 --sample-rate 96000 --block 64 || C=$?
            exit $(( A != 0 || B != 0 || C != 0 ))
          ) | tee -a "$GITHUB_STEP_SUMMARY"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Locate bundles
        run: |
          ART="build/${PRODUCT}_artefacts/${BUILD_TYPE}"
          echo "VST3=$ART/VST3/${PRODUCT}.vst3" >> "$GITHUB_ENV"
          echo "AU=$ART/AU/${PRODUCT}.component" >> "$GITHUB_ENV"
          ls -la "$ART/VST3" "$ART/AU"

      - name: Check both architectures are present
        run: |
          check() {
            local BIN="$1/Contents/MacOS/$2"
            ARCHS=$(lipo -archs "$BIN")
            echo "$BIN -> $ARCHS, $(stat -f%z "$BIN") bytes"
            [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "::error::$BIN is not universal"; exit 1; }
          }
          check "$VST3" "$PRODUCT"; check "$AU" "$PRODUCT"

      # The plugin runs on macOS 11 and later: each slice's LC_BUILD_VERSION minos must be 11.0.
      - name: Check minimum macOS is 11.0 (both architectures)
        run: |
          for B in "$VST3" "$AU"; do
            BIN="$B/Contents/MacOS/${PRODUCT}"
            for A in arm64 x86_64; do
              read -r MINOS SDK < <(otool -arch "$A" -l "$BIN" | awk '/cmd LC_BUILD_VERSION/ { f = 1 } f && $1 == "minos" { m = $2 } f && $1 == "sdk" { print m, $2; exit }') || true
              echo "$BIN ($A): minos ${MINOS:-none}, sdk ${SDK:-none}"
              [ "$MINOS" = "11.0" ] || { echo "::error::$BIN ($A) has minimum macOS ${MINOS:-none}, not 11.0"; exit 1; }
            done
          done

      - name: Check x86_64 slice has no AVX instructions
        run: |
          BIN="$VST3/Contents/MacOS/${PRODUCT}"
          COUNT=$(otool -arch x86_64 -tv "$BIN" | grep -cE '%[yz]mm' || true)
          echo "AVX/AVX-512 register uses in the x86_64 slice of $BIN: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "::error::AVX found in x86_64 slice (Rosetta 2 crash risk)"; exit 1; }

      # No "Made with JUCE" splash (docs/BUILDS.md, Kris 2026-11-23): every compile of the plugin's
      # JUCE modules that show it (juce_gui_basics, the splash; juce_audio_processors, the editor
      # that puts it up) carries JUCE_DISPLAY_SPLASH_SCREEN=0. The splash hides itself from
      # accessibility, so the mouse test cannot see it.
      - name: Check the JUCE splash screen is off
        run: |
          CMDS=$(ninja -C build -t commands ${PRODUCT}_VST3 ${PRODUCT}_AU | grep -E ' -c [^ ]*juce_(gui_basics|audio_processors)\.(cpp|mm)( |$)' || true)
          N=$(printf '%s\n' "$CMDS" | grep -c . || true)
          OFF=$(printf '%s\n' "$CMDS" | grep -cE ' -DJUCE_DISPLAY_SPLASH_SCREEN=0( |$)' || true)
          echo "plugin compiles of juce_gui_basics and juce_audio_processors: $N, with JUCE_DISPLAY_SPLASH_SCREEN=0: $OFF"
          [ "$N" -ge 2 ] && [ "$OFF" -eq "$N" ] || { echo "::error::the JUCE splash screen is not switched off in every plugin compile"; exit 1; }

      - name: Ad-hoc code sign
        run: |
          for B in "$VST3" "$AU"; do
            codesign --force --deep --sign - "$B"
            codesign --verify --deep --strict --verbose=2 "$B"
          done

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 5 \
            --validate-in-process \
            --skip-gui-tests \
            --timeout-ms 300000 \
            --validate "$VST3"

      - name: Validate AU (auval, native + Rosetta)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i "$AU_MANUFACTURER" || true
          auval -strict -v $AU_TYPE $AU_SUBTYPE $AU_MANUFACTURER
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta is not installed on this runner; installing it"
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          echo "--- x86_64 slice under Rosetta ---"
          arch -x86_64 auval -strict -v $AU_TYPE $AU_SUBTYPE $AU_MANUFACTURER

      # Real mouse events through the AU and VST3 wrappers: a new instance's editor at its opening size
      # (1104 x 736, smaller on a small display such as the runner's; docs/UI_SPEC.md section 2), EDGE's default note (64) and the
      # default sticks of every preset (BELL and BOW TIP, BELL2 and BOW2 SHOULDER), then change
      # the MIDI channel, the slot notes (drag, menu, RESET DEFAULT, note list), a stick, the
      # preset and a stick of that preset, then SWISH, RAVEN, EXTRA PAPER THIN 24", KONSTAN CRASH 18" and CRASH 16", in the
      # editor, and check the plugin's saved state; HI-HAT: its Blend Position knobs hidden, its two
      # rows and the pedal played through the host (MIDI notes and CC), the hats and the pedal drawing
      # following the pedal CC, also on channel 1 with MIDI CHANNEL 16 (a keyboard's mod wheel), with
      # one FOOT on the close, a pedal CC picked in the PEDAL box saved and restored; then KONSTAN
      # again, its Blend Position knobs shown; the scroll wheel over the knobs and boxes
      # must change nothing; dragging, double-clicking and automating each of the five knobs
      # must move its parameter and the value the knob shows, which its position arc is drawn
      # from (docs/UI_SPEC.md section 6). Then click the TUNING tab: the TUNING page must show its
      # panel in the page area, with the knobs hidden, and the session save the page;
      # the wheel over its sliders and numeric boxes must change nothing; EDGE VOICE FROM BOW
      # must move on KONSTAN, RAVEN, SWISH, EXTRA PAPER THIN, CRASH 16", HAMMERED and STINE (STINE FLAT RIDE: every row played
      # with both sticks, its tuning saved and loaded back, and a SMOKE FLAT RIDE session reopening on it with its sticks and
      # notes; the rows and the session through Cymbalis's processor compiled into the tool); SWISH's bow_shoulder must take
      # NOVA SHOULDER PROFILE's bow profile, EXTRA PAPER THIN's and CRASH 16"'s bell_shoulder and bow_shoulder Nova's bell and
      # bow profiles (each preset's tuning then saved and loaded back), and NOVA RIDE must have no such button; NOVA's first articulation's
      # three STICK CLICK weights must move; HIT VARIATION's switch must flip and its two spreads
      # move (NOVA); a tuning file saved and loaded back (through
      # stand-ins for the file panels) must hold and restore the tuning; on HI-HAT the panel
      # shows the values that act on it and hides the others, and the foot splash's SPLASH WINDOW
      # and SPLASH REOPEN must move and be saved and loaded back; on the TUNING page, STINE FLAT RIDE
      # chosen in the CYMBAL box must show in the panel, a session saved on the page must reopen on
      # it (VST3), and the editor resized by the host must keep the panel's text size and fit it to
      # the page area (VST3: the AU host's resize does not reach the plugin's editor; both after the
      # drags below, which did nothing after either); the CYMBAL tab
      # shows the CYMBAL page again, and the TUNING tab the panel; on the CYMBAL page, the editor's
      # resizer dragged
      # to its limits (960 x 640, 1536 x 1024, 3:2 in between), and a session saved at another size reopening at it (VST3)
      # (tools/cymbalis_uitest).
      # 65 steps in each host took about 2.6 minutes per host on the runner (59 took 4.8 minutes in
      # all with EXTRA PAPER THIN 24"); 68 with the editor's sizes took under 8 minutes; 72 with STINE FLAT RIDE's took
      # 6 minutes in all; 76 with the TUNING page's, within 10; 77 with the splash's.
      # On request only (full_tests) or on a v* tag.
      - name: Editor mouse test (AU and VST3)
        if: (github.event_name == 'workflow_dispatch' && inputs.full_tests) || startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        run: |
          UITEST="build/CymbalisUiTest_artefacts/${BUILD_TYPE}/CymbalisUiTest.app/Contents/MacOS/CymbalisUiTest"
          STEPS="opensize edge sticks channel drag reset none edgereset list stick preset shoulder swish raven paperthin konstan azcrash hihat blendhidden hihatplay hihatpedal hihatswing pedalchannel pedalcc konstan blendshown wheel arcs tuning wheeltuning voice raven voice swish voice profile paperthin voice ptprofile savetuning loadtuning azcrash voice azprofile savetuning loadtuning preset voice stine stinerows smokesession voice savetuning loadtuning nova noprofile nohihatvalues clickweights hitvariation savetuning loadtuning hihat hihattuning hihatvalues hihatopen hihatsplash savetuning loadtuning tuningpreset tuningclose tuning tuningclose dragsize tuning tuningresize savedpage savedsize"
          echo "--- VST3 ---"
          "$UITEST" "$PWD/$VST3" $STEPS
          echo "--- AU ---"
          "$UITEST" AU $STEPS

      # The hit display (docs/UI_SPEC.md sections 10 and 11) with 16 hits moving the wireframe
      # cymbal at 1536 x 1024: processBlock at 44.1 kHz (256 and 128 samples, normal and
      # real-time audio thread) with the editor closed, open and idle, open with the hits, and on
      # the TUNING page with the hits and idle (the cymbal hidden must draw nothing), each three
      # times, with the message thread's CPU, then once more with HAMMERED THIN RIDE selected, and once each with
      # SWISH, RAVEN, EXTRA PAPER THIN 24", KONSTAN CRASH 18" and CRASH 16" (their dented meshes) and HI-HAT (two dented cymbals,
      # the clutch and rod, the pedal CC moving the hats and the pedal drawing);
      # the CPU used besides; the editor's paint calls and the cymbal's OpenGL frames; and
      # once, that nothing is drawn after every hit is older than 6 s.
      # Printed to the log and the job summary only. With the TUNING page's two cases (hits, and
      # idle) it takes about 8.5 minutes (7 with the first alone), hence 12.
      # On request only (full_tests) or on a v* tag.
      - name: Hit display timing
        if: (github.event_name == 'workflow_dispatch' && inputs.full_tests) || startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 12
        run: |
          UITEST="build/CymbalisUiTest_artefacts/${BUILD_TYPE}/CymbalisUiTest.app/Contents/MacOS/CymbalisUiTest"
          "$UITEST" hits | tee hits.txt
          test "${PIPESTATUS[0]}" -eq 0
          { echo "### Hit display timing"; echo '```'; cat hits.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          SHA=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="$SHA"; fi
          mkdir -p dist
          ditto -c -k --keepParent "$VST3"  "dist/${PRODUCT}-VST3-macOS-${TAG}.zip"
          ditto -c -k --keepParent "$AU"    "dist/${PRODUCT}-AU-macOS-${TAG}.zip"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-macOS-${{ env.TAG }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
