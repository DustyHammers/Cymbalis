name: Build macOS (VST3 + AU)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach zips to a GitHub Release on v* tags

env:
  BUILD_TYPE: Release
  PRODUCT: Cymbalis
  AU_TYPE: aumu
  AU_SUBTYPE: Cymb
  AU_MANUFACTURER: Dham

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JUCE 7.0.12 predates the macOS 15 SDK; build against Xcode 15.x (macOS 14 SDK).
      - name: Select Xcode 15
        run: |
          XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Cache JUCE source
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ env.BUILD_TYPE }}

      # Cymbalis with the Tuning window (CYMBALIS_WITH_TUNING, ON by default, docs/TUNING.md).
      - name: Configure (universal arm64 + x86_64)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DFETCHCONTENT_BASE_DIR="${GITHUB_WORKSPACE}/.deps"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build the bake loader
        run: cmake --build build --target cymbalis_engine --parallel

      # Scratch branch only (not for merging): the final head against main, bit for bit (both
      # slices, mechanisms off and on), then main's engine against the branch's, alternately,
      # paced on a real-time thread, the smallest of four runs per block, with flams.
      - name: Identity and timing against main (scratch)
        timeout-minutes: 40
        run: |
          git fetch --depth 1 origin main:refs/remotes/origin/main
          echo "### Identity, arm64"; tools/cymbalis_identity/run.sh --arch arm64 || true
          echo "### Identity, x86_64 (Rosetta)"; tools/cymbalis_identity/run.sh --arch x86_64 || true
          echo "### Timing"; tools/cymbalis_identity/run.sh --arch arm64 --time --runs 4
